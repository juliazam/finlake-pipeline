x-airflow-common-env: &airflow-common-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
  AIRFLOW_CONN_AWS_DEFAULT: ${AIRFLOW_CONN_AWS_DEFAULT}
  AIRFLOW_CONN_POSTGRES_DEFAULT: ${AIRFLOW_CONN_POSTGRES_DEFAULT}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}

volumes:
  ministack_state:
  ministack_s3_data:
  
services:
  db:
    image: postgres:16
    container_name: database
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  migrator:
    build:
      context: .
    container_name: migration
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - RUNNING_IN_DOCKER=true
  
  ministack:
    image: ministackorg/ministack
    container_name: ministack
    ports:
      - "4566:4566"
    environment:
      - PERSIST_STATE=1
      - S3_PERSIST=1
    volumes:
      - ministack_state:/tmp/ministack-state
      - ministack_s3_data:/tmp/ministack-data/s3
  
  airflow-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 5

  airflow-init:
    image: apache/airflow:3.3.0
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
      AIRFLOW_AWS_CONN_LOGIN: ${AIRFLOW_AWS_CONN_LOGIN}
      AIRFLOW_AWS_CONN_PASSWORD: ${AIRFLOW_AWS_CONN_PASSWORD}
      MINISTACK_ENDPOINT: ${MINISTACK_ENDPOINT}
    entrypoint: /bin/bash
    command: >
      -c "airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com || true"

  airflow-apiserver:
    image: apache/airflow:3.3.0
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-env
    volumes:
      - ./dags:/opt/airflow/dags
    ports:
      - "8080:8080"
    command: api-server

  airflow-scheduler:
    image: apache/airflow:3.3.0
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-env
    volumes:
      - ./dags:/opt/airflow/dags
    command: scheduler
  
  airflow-dag-processor:
    image: apache/airflow:3.3.0
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-env
    volumes:
      - ./dags:/opt/airflow/dags
    command: dag-processor

  terraform-init:
    image: hashicorp/terraform:1.15
    working_dir: /workspace
    volumes:
      - .:/workspace
    depends_on:
      ministack:
        condition: service_healthy
    entrypoint: sh
    command: -c "cd terraform && terraform init && terraform apply -auto-approve"

  glue-transform-test:
    image: public.ecr.aws/glue/aws-glue-libs:5
    volumes:
      - ./glue:/home/glue_user/workspace
    command: >
      spark-submit /home/glue_user/workspace/transform_job.py
      --JOB_NAME test_job
      --data_file_path /home/glue_user/workspace/data_batch.csv
      --output_path /home/glue_user/workspace/output.csv
    profiles:
      - manual