name: Terraform CI

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'glue/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'glue/**'

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy CI env file
        run: cp .env.ci .env

      - name: Start MiniStack
        run: docker compose up -d ministack

      - name: Wait for MiniStack to be healthy
        run: |
          for i in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' ministack)
            if [ "$status" = "healthy" ]; then
              echo "MiniStack is healthy"
              break
            fi
            echo "Waiting for MiniStack... ($i)"
            sleep 2
          done

      - name: Terraform fmt check
        run: docker compose run --rm --entrypoint sh terraform-init -c "cd terraform && terraform fmt -check -recursive"

      - name: Bootstrap state bucket
        run: docker run --rm --network container:ministack amazon/aws-cli --endpoint-url=http://ministack:4566 s3 mb s3://finlake-terraform-state

      - name: Terraform validate
        run: docker compose run --rm --entrypoint sh terraform-init -c "cd terraform && terraform init && terraform validate"

      - name: Terraform plan
        run: docker compose run --rm --entrypoint sh terraform-init -c "cd terraform && terraform plan"